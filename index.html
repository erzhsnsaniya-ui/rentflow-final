<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RentFlow — аренда и лизинг цифровой техники</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f5;--surface:#fff;--surface2:#eef1f0;--text:#1c2321;--muted:#66716e;--border:#dfe5e3;--primary:#0f766e;--on-primary:#fff;--ok:#15803d;--busy:#b91c1c;--warn:#b45309;--star:#d97706;--shadow:0 6px 24px rgba(20,35,30,.07);--r:16px;color-scheme:light}
html[data-theme="dark"]{--bg:#0d1211;--surface:#161c1a;--surface2:#1e2625;--text:#e7eeec;--muted:#93a19d;--border:#27312f;--primary:#2dd4bf;--on-primary:#042f2c;--ok:#4ade80;--busy:#f87171;--warn:#fbbf24;--star:#fbbf24;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;display:flex;flex-direction:column}
button{font-family:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input:disabled{opacity:.6}
main{flex:1}
.container{max-width:1200px;margin:0 auto;padding:24px 20px}
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#334155);color:#fff;display:grid;place-items:center;font-weight:800}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer}
.tab.active,.tab:hover{background:var(--surface2);color:var(--text)}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center}
.controls select{width:auto;padding:8px 10px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;color:var(--text);display:grid;place-items:center;padding:0;transition:border-color .2s,background .2s}
.icon-btn:hover{border-color:var(--primary)}
.ui-ico{width:16px;height:16px;display:inline-block;vertical-align:-3px;flex-shrink:0}
.btn{background:var(--primary);color:var(--on-primary);border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--busy);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px}
.role{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px}
.v-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:5px;vertical-align:-2px;cursor:help}
.v-badge svg{width:100%;height:100%}
.hero{background:linear-gradient(120deg,#0f766e,#334155);color:#fff;padding:40px 20px;text-align:center}
.hero h1{margin:0 0 8px;font-size:32px}
.hero p{margin:0 auto;max-width:640px;opacity:.9}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:220px}
.toolbar select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{color:var(--muted);margin:4px 0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px)}
.thumb{height:160px;position:relative;display:grid;place-items:center;overflow:hidden}
.thumb.big{height:300px;border-radius:var(--r)}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.glyph{display:block;width:64px;height:64px;color:rgba(255,255,255,.95);filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}
.glyph svg{width:100%;height:100%}
.thumb.big .glyph{width:120px;height:120px}
.glyph-sm{display:grid;place-items:center;width:100%;height:100%;color:#fff}
.glyph-sm svg{width:60%;height:60%}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;z-index:1}
.badge.ok{background:var(--ok)}
.badge.busy{background:var(--busy)}
.badge.lease{left:auto;right:10px;background:var(--warn)}
.card-body{padding:14px}
.card-body h3{margin:0 0 6px;font-size:16px}
.meta{color:var(--muted);font-size:14px}
.price{margin-top:10px;font-size:18px}
.price span{font-size:13px;color:var(--muted)}
.discount-tag{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:600;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);padding:3px 9px;border-radius:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.card-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.detail{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.detail h1{font-size:28px;margin:18px 0 6px}
.desc{line-height:1.6;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.specs div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.specs span{display:block;color:var(--muted);font-size:13px}
.ok-text{color:var(--ok)}
.seller{margin-top:14px}
.booking{position:sticky;top:90px;align-self:start}
.segmented,.seg-tabs{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:16px;gap:4px;flex-wrap:wrap}
.segmented button,.seg-tabs button{flex:1;border:0;background:none;padding:9px 12px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.segmented button.on,.seg-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.cal-head button{background:var(--surface2);border:0;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer}
.cal-head button:disabled{opacity:.3;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:12px;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;border:0;border-radius:10px;background:var(--surface2);color:var(--text);font-size:14px;cursor:pointer;font-weight:600}
.day:hover:not(:disabled){outline:2px solid var(--primary)}
.day.busy{background:transparent;color:var(--busy);text-decoration:line-through;cursor:not-allowed;opacity:.75}
.day.past{opacity:.3;cursor:not-allowed}
.day.sel{background:color-mix(in srgb,var(--primary) 25%,transparent)}
.day.edge{background:var(--primary);color:var(--on-primary)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:10px 0;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.summary{margin:16px 0;border-top:1px dashed var(--border);padding-top:14px}
.lease-compare{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:13px;display:grid;gap:8px;line-height:1.4}
.lease-compare .capex{color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.lease-compare .capex b{color:var(--busy)}
.lease-compare .opex{color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.lease-compare .opex b{color:var(--ok)}
.lease-compare .saved{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--text);padding:8px 10px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;font-size:14px}
.row.total{font-weight:800;font-size:17px;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.err{color:var(--busy);margin:0;min-height:16px;font-size:13px}
.page-title{margin:0 0 18px;font-size:26px}
.section-title{font-size:20px;margin:28px 0 12px}
.form{display:grid;gap:14px;max-width:680px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.switch{display:flex;gap:8px;align-items:center;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.profile{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#0f766e,#334155);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;margin-bottom:12px}
.owner-head{display:flex;gap:18px;align-items:center;margin:16px 0 8px}
.owner-head .avatar{margin:0;flex-shrink:0}
.owner-head h1{margin:0 0 4px;font-size:26px}
.stars{color:var(--star);letter-spacing:1px}
.stats{display:flex;gap:12px;margin:16px 0}
.stats div{flex:1;background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:20px}
.info-list{margin:14px 0;display:grid;gap:8px;font-size:14px}
.info-list div{display:flex;justify-content:space-between;gap:12px}
.item{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;background:var(--surface)}
.item .ico{width:56px;height:56px;border-radius:12px;flex-shrink:0;overflow:hidden;position:relative;cursor:pointer}
.item .info{flex:1;min-width:180px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);display:inline-flex;align-items:center;gap:5px}
.pill.done{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill.up{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--busy) 18%,transparent);color:var(--busy)}
.review{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--surface);margin-bottom:10px}
.rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.review p{margin:0;color:var(--muted);line-height:1.5}
.starrow{display:flex;gap:4px;margin:6px 0 12px}
.starbtn{background:none;border:0;font-size:32px;color:var(--border);cursor:pointer;padding:0 2px;line-height:1}
.starbtn.on{color:var(--star)}
.mtitle{margin:0 0 14px;font-size:20px}
.row-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.gallery{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.gallery img,.gallery video{width:84px;height:64px;object-fit:cover;border-radius:10px;flex-shrink:0;cursor:pointer;border:2px solid transparent}
.gallery img:hover,.gallery video:hover{border-color:var(--primary)}
.previews{display:flex;gap:8px;flex-wrap:wrap}
.prev{width:72px;height:72px;object-fit:cover;border-radius:10px}
.demo{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border)}
.demo-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.dash-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.dash-summary div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.dash-summary b{display:block;font-size:22px;margin-top:4px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.table th{color:var(--muted);font-weight:600;font-size:13px}
.chat-layout{display:grid;grid-template-columns:280px 1fr;gap:18px;height:65vh;min-height:420px}
.conv{overflow:auto;padding:10px}
.conv-item{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px;border-radius:12px;color:var(--text);cursor:pointer;text-align:left}
.conv-item.on,.conv-item:hover{background:var(--surface2)}
.conv-item small{display:block;color:var(--muted)}
.conv-ico{width:40px;height:40px;border-radius:10px;flex-shrink:0}
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:72%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.bubble-media{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.15);max-width:260px;background:#000;cursor:pointer;position:relative}
.bubble-media:hover::after{content:'🔍 На весь экран';position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;font-weight:600}
.bubble-media img,.bubble-media video{display:block;width:100%;max-height:180px;object-fit:cover}
.audit-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;opacity:.85;margin-top:6px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.15)}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);align-items:center;position:relative}
.composer input{flex:1}
.attach-wrap{position:relative;flex-shrink:0}
.attach-menu{position:absolute;bottom:50px;left:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:grid;gap:2px;z-index:30}
.attach-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s}
.attach-item:hover{background:var(--surface2)}
.upload-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upload-card{border:1px dashed var(--border);background:var(--surface2);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:border-color .2s}
.upload-card:hover{border-color:var(--primary)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:26px;width:min(520px,100%);max-height:92vh;overflow:auto;position:relative;box-shadow:var(--shadow)}
.modal.wide{width:min(860px,100%)}
.modal .x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.modal .x:hover{background:var(--surface2);color:var(--text)}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;transition:.3s;z-index:200;opacity:0;max-width:90vw}
#toast.show{transform:translate(-50%,0);opacity:1}
.password-wrapper{position:relative;display:flex;align-items:center}
.password-wrapper input{width:100%;padding-right:42px}
.eye-btn{position:absolute;right:10px;background:none;border:0;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:4px}
.eye-btn:hover{color:var(--text)}
.admin-banner{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.offer-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0}
.sign-box{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin:8px 0;display:grid;gap:10px}
.otp-row{display:flex;gap:8px;align-items:center}
.otp-row input{letter-spacing:4px;font-weight:800;text-align:center;font-size:16px}
.contract-preview{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;color:var(--muted);max-height:150px;overflow:auto;line-height:1.5;margin-top:6px}
.dispute-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.media-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.media-stage{position:relative;height:210px;background:#0b1114;display:grid;place-items:center;overflow:hidden}
.media-stage img,.media-stage video{width:100%;height:100%;object-fit:cover}
.media-overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;flex-direction:column;justify-content:space-between;padding:10px}
.media-top-bar{display:flex;justify-content:space-between;align-items:center;width:100%}
.fullscreen-btn{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-weight:600}
.fullscreen-btn:hover{background:rgba(0,0,0,.85)}
.play-trigger{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:rgba(15,118,110,.92);color:#fff;border:2px solid #fff;display:grid;place-items:center;cursor:pointer;margin:auto;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .15s}
.play-trigger:hover{transform:scale(1.08)}
.media-meta{padding:12px;font-size:12px;display:grid;gap:4px}
.hash-code{font-family:monospace;font-size:11px;color:var(--muted);background:var(--surface);padding:3px 6px;border-radius:6px;border:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sim-bar{height:4px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin-top:6px}
.sim-fill{height:100%;width:0%;background:#2dd4bf;transition:width .2s linear}
.fs-stage{background:#000;display:grid;place-items:center;border-radius:12px;max-height:68vh;overflow:hidden;margin:12px 0}
.fs-stage video,.fs-stage img{max-width:100%;max-height:65vh;object-fit:contain}
@media(max-width:820px){
  .detail,.profile,.chat-layout,.dispute-grid{grid-template-columns:1fr}
  .booking{position:static}
  .chat-layout{height:auto}
  .conv{max-height:200px}
  .bubble{max-width:85%}
  .grid2,.dash-summary,.upload-options{grid-template-columns:1fr}
  .hero h1{font-size:24px}
  .table{font-size:13px}
}

@keyframes waveOpen {
  0% { opacity: 0; transform: scale(0.86) translateY(18px); filter: blur(4px); }
  60% { opacity: 1; transform: scale(1.02) translateY(-2px); filter: blur(0px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.modal.wave-modal { animation: waveOpen 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
.fs-toolbar { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--surface2); padding:10px 14px; border-radius:12px; margin-bottom:10px; }
.fs-stage { position:relative; background:#05080a; display:grid; place-items:center; border-radius:14px; height:64vh; overflow:auto; margin:8px 0; border:1px solid var(--border); }
.fs-stage img, .fs-stage video { max-width:100%; max-height:60vh; object-fit:contain; transition:transform 0.25s cubic-bezier(0.22,1,0.36,1); transform-origin:center center; }
.stepper { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 4px; font-size:11px; font-weight:700; }
.step-node { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
.step-node.done { background:color-mix(in srgb,var(--ok) 16%,transparent); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent); }
.step-node.active { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }

.step-arrow { color:var(--muted); font-size:10px; }

.sync-dot { width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }

function findUserByIdOrIndex(val){
  if(val === undefined || val === null || val === '') return null;
  const num = Number(val);
  if(!isNaN(num) && USERS[num]) return USERS[num];
  const q = String(val).toLowerCase();
  return USERS.find(x => (x.id && x.id.toLowerCase() === q) || (x.email && x.email.toLowerCase() === q) || (x.name && x.name.toLowerCase() === q)) || null;
}

/* Чтение файла в сжатый DataURL для гарантированной передачи через Supabase без лимитов размера */
function fileToDataUrl(file){
  return new Promise((resolve) => {
    if(!file) return resolve('');
    if(typeof file === 'string') return resolve(file);
    // Для не-изображений (PDF или короткие видео)
    if(!file.type || !file.type.startsWith('image/')){
      if(file.size > 800 * 1024){
        // Предотвращаем раздувание прикреплений
        return resolve(SAMPLE_DAMAGE_IMG);
      }
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
      return;
    }
    // Сжатие фото через Canvas (до 800px, 0.65 JPEG) -> размер всего 30-50 КБ
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let w = img.width, h = img.height;
      const maxDim = 800;
      if(w > maxDim || h > maxDim){
        if(w > h){
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, w);
      canvas.height = Math.max(1, h);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const compressedData = canvas.toDataURL('image/jpeg', 0.65);
      resolve(compressedData);
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    };
    img.src = objectUrl;
  });
}

/* ============================================================================
   МНОГОУРОВНЕВАЯ СИНХРОНИЗАЦИЯ С SUPABASE REALTIME & BROADCAST
   Таблицы: profiles, products, bookings, notifications, messages
   Канал Broadcast: мгновенная передача данных между устройствами (phone <-> laptop <-> tablet)
   ============================================================================ */

let realtimeBroadcastChannel = null;

function broadcastSync(event, payload){
  if(!payload) return;
  // 1. Supabase Realtime Broadcast (WebSocket)
  if(realtimeBroadcastChannel && state.realtimeConnected){
    try {
      realtimeBroadcastChannel.send({ type: 'broadcast', event, payload });
    } catch(e){ console.warn('Broadcast send warn:', e); }
  }
  // 2. Межвкладочный обмен (если открыто несколько вкладок браузера)
  try {
    localStorage.setItem('rf_cross_tab_sync', JSON.stringify({ event, payload, ts: Date.now() }));
  } catch(e){}
}

function isNotificationRelevantForCurrentUser(notif){
  if(!state.user || !notif) return false;
  const userRole = state.user.role;
  const userEmail = (state.user.email || '').toLowerCase().trim();
  const userName = (state.user.name || '').toLowerCase().trim();
  const notifEmail = (notif.user_email || '').toLowerCase().trim();
  const notifName = (notif.user_name || '').toLowerCase().trim();
  const notifTargetRole = notif.target_role || '';
  const notifType = notif.type || '';
  const notifText = notif.text || '';

  // 1. Для Администратора: только админские заявки и системные уведомления модерации/KYC
  if(userRole === 'admin'){
    return notifTargetRole === 'admin' 
        || notifType === 'admin_verification_request' 
        || notifType === 'admin_moderation_request' 
        || notifEmail === 'admin@demo'
        || notifText.includes('модерации') 
        || notifText.includes('KYC');
  }

  // 2. Для Техподдержки / Арбитра: только споры и арбитраж по залогам
  if(userRole === 'support'){
    return notifTargetRole === 'support' 
        || notifType === 'support_dispute'
        || notifEmail === 'support@demo'
        || notifText.includes('спор') 
        || notifText.includes('Арбитр');
  }

  // 3. Для Арендатора и Владельца: строго личные уведомления, адресованные их email или имени
  if(userRole === 'renter' || userRole === 'owner'){
    // Служебные уведомления для админа и саппорта полностью игнорируются
    if(notifTargetRole === 'admin' || notifTargetRole === 'support') return false;
    if(notifType === 'admin_verification_request' || notifType === 'admin_moderation_request') return false;
    
    // Проверяем прямое совпадение по email или имени
    const isDirectEmail = notifEmail && notifEmail === userEmail;
    const isDirectName = notifName && notifName === userName;
    return Boolean(isDirectEmail || isDirectName);
  }

  return false;
}

function applySyncEvent(event, payload){
  if(!payload) return;
  try {
    if(event === 'user_registered' || event === 'user_updated'){
      const targetEmail = (payload.email || '').toLowerCase();
      const idx = USERS.findIndex(u => u.email.toLowerCase() === targetEmail);
      if(idx >= 0){
        USERS[idx] = Object.assign({}, USERS[idx], payload);
        if(state.user && state.user.email.toLowerCase() === targetEmail){
          state.user = USERS[idx];
          if(event === 'user_updated' && payload.verification === 'verified'){
            toast('Ваш профиль верифицирован администратором ✓');
          }
        }
      } else {
        USERS.push(payload);
      }
      render();
    } else if(event === 'product_published'){
      const pid = Number(payload.id);
      const idx = P.findIndex(p => Number(p.id) === pid);
      if(idx >= 0) P[idx] = Object.assign({}, P[idx], payload);
      else P.unshift(payload);
      render();
    } else if(event === 'product_updated'){
      const pid = Number(payload.id);
      const idx = P.findIndex(p => Number(p.id) === pid);
      if(idx >= 0){ P[idx] = Object.assign({}, P[idx], payload); render(); }
    } else if(event === 'product_deleted'){
      const pid = Number(payload.id);
      const idx = P.findIndex(p => Number(p.id) === pid);
      if(idx >= 0){ P.splice(idx, 1); render(); }
    } else if(event === 'booking_created'){
      const bid = Number(payload.id);
      const idx = state.bookings.findIndex(b => Number(b.id) === bid);
      if(idx >= 0) state.bookings[idx] = Object.assign({}, state.bookings[idx], payload);
      else state.bookings.unshift(payload);
      render();
    } else if(event === 'booking_updated'){
      const bid = Number(payload.id);
      const idx = state.bookings.findIndex(b => Number(b.id) === bid);
      if(idx >= 0){ state.bookings[idx] = Object.assign({}, state.bookings[idx], payload); render(); }
    } else if(event === 'notification_created'){
      // Жесткая фильтрация: игнорируем чужие уведомления
      if(!isNotificationRelevantForCurrentUser(payload)) return;
      const nid = Number(payload.id);
      const exists = state.notifications.some(n => n.id === nid || (n.text === payload.text && n.user_email === payload.user_email));
      if(!exists){ state.notifications.unshift(payload); render(); }
    } else if(event === 'message_sent'){
      const pid = Number(payload.product_id);
      if(pid){
        if(!state.chats[pid]) state.chats[pid] = [];
        const exists = state.chats[pid].some(m => m.id === payload.id || (m.text === payload.text && m.time === payload.time));
        if(!exists){
          const isMe = state.user && payload.sender_name && payload.sender_name.toLowerCase() === state.user.name.toLowerCase();
          state.chats[pid].push(Object.assign({}, payload, { from: isMe ? 'me' : 'them' }));
          render();
          scrollMsgs();
        }
      }
    }
  } catch(err){ console.warn('applySyncEvent err:', err); }
}

async function dbUpsertProfile(u){
  if(!sb || !u) return;
  try {
    const sanitizedProfile = Object.assign({}, u.profile || {});
    if(sanitizedProfile.kycScanUrl && sanitizedProfile.kycScanUrl.length > 70000){
      sanitizedProfile.kycScanUrl = sanitizedProfile.kycScanUrl.slice(0, 70000);
    }
    const cleanU = Object.assign({}, u, { profile: sanitizedProfile });
    const payload = {
      id: String(u.id || 'u_' + Date.now()),
      email: String(u.email || '').toLowerCase(),
      name: String(u.company && u.company.name ? u.company.name : (u.name || 'User')),
      role: String(u.role || 'renter'),
      verification: String(u.verification || 'pending'),
      raw_data: cleanU
    };

    const { error } = await sb.from('profiles').upsert(payload, { onConflict: 'email' });
    if(error){
      console.error("SUPABASE ERROR:", error);
    } else {
      console.log("Профиль успешно сохранен в базу:", payload.email);
    }
  } catch(e){
    console.error("dbUpsertProfile exception:", e);
  }
}

async function dbInsertProduct(prod){
  if(!sb || !prod) return;
  try {
    const cleanProd = Object.assign({}, prod);
    if(Array.isArray(cleanProd.photos)){
      cleanProd.photos = cleanProd.photos.map(p => (typeof p === 'string' && p.length > 70000 ? p.slice(0, 70000) : p));
    }
    const fullPayload = {
      id: Number(prod.id),
      name: prod.name,
      cat: prod.cat,
      price: Number(prod.price),
      price3: Number(prod.price3 || Math.round(prod.price * 0.8)),
      value: Number(prod.value || 0),
      seller: prod.seller,
      seller_email: prod.sellerEmail || '',
      district: prod.district,
      lease: !!prod.lease,
      cond: prod.cond,
      status: prod.status,
      raw_data: cleanProd
    };
    const { error } = await sb.from('products').insert([fullPayload]);
    if(error){
      await sb.from('products').insert([{ id: Number(prod.id), name: prod.name, price: Number(prod.price), status: prod.status, raw_data: cleanProd }]);
    }
  } catch(e){
    console.warn('dbInsertProduct fallback:', e);
    try { await sb.from('products').insert([{ id: Number(prod.id), name: prod.name, status: prod.status }]); } catch(e2){}
  }
}

async function dbUpdateProduct(prod, deleteIt=false){
  if(!sb || !prod) return;
  try {
    if(deleteIt){
      await sb.from('products').delete().eq('id', Number(prod.id));
    } else {
      const { data: ex } = await sb.from('products').select('id').eq('id', Number(prod.id)).maybeSingle();
      if(ex){
        await sb.from('products').update({ status: prod.status, price: Number(prod.price), raw_data: prod }).eq('id', Number(prod.id));
      } else {
        await dbInsertProduct(prod);
      }
    }
  } catch(e){ console.warn('dbUpdateProduct:', e); }
}

    time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})
  };
  
  // Добавляем в память локально
  state.notifications.unshift(newNotif);
  broadcastSync('notification_created', newNotif);
  render();

  // Сохраняем в реальную таблицу Supabase
  if(sb){
    try {
      const { error } = await sb.from('notifications').insert([{
        id: newNotif.id,
        user_email: newNotif.user_email,
        text: newNotif.text,
        read: false,
        raw_data: newNotif
      }]);
      if(error) console.error("Ошибка сохранения уведомления в БД:", error);
    } catch(e){
      console.error("Исключение при сохранении уведомления:", e);
    }
  }
}

function applySyncEvent(event, payload){
  if(!payload) return;
  try {
    if(event === 'user_registered' || event === 'user_updated'){
      const targetEmail = (payload.email || '').toLowerCase();
      const idx = USERS.findIndex(u => u.email.toLowerCase() === targetEmail);
      if(idx >= 0){
        USERS[idx] = Object.assign({}, USERS[idx], payload);
        if(state.user && state.user.email.toLowerCase() === targetEmail){
          state.user = USERS[idx];
        }
      } else {
        USERS.push(payload);
      }
      render();
    } else if(event === 'product_published' || event === 'product_updated'){
      const pid = Number(payload.id);
      const idx = P.findIndex(p => Number(p.id) === pid);
      if(idx >= 0) P[idx] = Object.assign({}, P[idx], payload);
      else P.unshift(payload);
      render();
    } else if(event === 'product_deleted'){
      const pid = Number(payload.id);
      const idx = P.findIndex(p => Number(p.id) === pid);
      if(idx >= 0){ P.splice(idx, 1); render(); }
    } else if(event === 'booking_created' || event === 'booking_updated'){
      const bid = Number(payload.id);
      const idx = state.bookings.findIndex(b => Number(b.id) === bid);
      if(idx >= 0) state.bookings[idx] = Object.assign({}, state.bookings[idx], payload);
      else state.bookings.unshift(payload);
      render();
   } else if(event === 'notification_created'){
      // СТРОГИЙ ФИЛЬТР: уведомление видит ТОЛЬКО тот, кому оно реально адресовано по email
      if(!state.user) return;
      const myEmail = state.user.email.toLowerCase();
      const targetEmail = (payload.user_email || '').toLowerCase();

      // Если email совпадает лично с нашим — показываем обязательно
      let isForMe = (targetEmail === myEmail);

      // Исключение для роли: админ/саппорт видят общие системные запросы (модерация, споры), 
      // но ТОЛЬКО если это уведомление адресовано их роли, а не конкретному пользователю
      if (!isForMe) {
        const myRole = state.user.role;
        const targetRole = payload.target_role || '';
        
        // Если мы админ и уведомление системное для админа (и не личное для кого-то другого)
        if (myRole === 'admin' && targetRole === 'admin' && !targetEmail.includes('@demo') && targetEmail === 'admin@demo') {
          isForMe = true;
        }
        // Если мы саппорт и уведомление по спорам для саппорта
        if (myRole === 'support' && targetRole === 'support' && targetEmail === 'support@demo') {
          isForMe = true;
        }
      }

      if(isForMe){
        const nid = Number(payload.id);
        const exists = state.notifications.some(n => n.id === nid || (n.text === payload.text && n.user_email === payload.user_email));
        if(!exists){ state.notifications.unshift(payload); render(); }
      }
    } else if(event === 'message_sent'){
      const pid = Number(payload.product_id);
      if(pid){
        if(!state.chats[pid]) state.chats[pid] = [];
        const exists = state.chats[pid].some(m => m.id === payload.id || (m.text === payload.text && m.time === payload.time));
        if(!exists){
          const isMe = state.user && payload.sender_name && payload.sender_name.toLowerCase() === state.user.name.toLowerCase();
          state.chats[pid].push(Object.assign({}, payload, { from: isMe ? 'me' : 'them' }));
          render();
          scrollMsgs();
        }
      }
    }
  } catch(err){ console.warn('applySyncEvent err:', err); }
}

function setupRealtimeSubscription(){
  if(!sb || !sb.channel) return;
  try {
    realtimeBroadcastChannel = sb.channel('rentflow-sync-channel', { config: { broadcast: { ack: true } } });

    realtimeBroadcastChannel
      .on('broadcast', { event: 'user_registered' }, ({ payload }) => applySyncEvent('user_registered', payload))
      .on('broadcast', { event: 'user_updated' }, ({ payload }) => applySyncEvent('user_updated', payload))
      .on('broadcast', { event: 'product_published' }, ({ payload }) => applySyncEvent('product_published', payload))
      .on('broadcast', { event: 'product_updated' }, ({ payload }) => applySyncEvent('product_updated', payload))
      .on('broadcast', { event: 'product_deleted' }, ({ payload }) => applySyncEvent('product_deleted', payload))
      .on('broadcast', { event: 'booking_created' }, ({ payload }) => applySyncEvent('booking_created', payload))
      .on('broadcast', { event: 'booking_updated' }, ({ payload }) => applySyncEvent('booking_updated', payload))
      .on('broadcast', { event: 'notification_created' }, ({ payload }) => applySyncEvent('notification_created', payload))
      .on('broadcast', { event: 'message_sent' }, ({ payload }) => applySyncEvent('message_sent', payload))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => syncFromSupabase())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => syncFromSupabase())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => syncFromSupabase())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, () => syncFromSupabase())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => syncFromSupabase())
      .subscribe((status) => {
        state.realtimeConnected = (status === 'SUBSCRIBED');
        renderHeader();
      });

    // Межвкладочный слушатель fallback
    window.addEventListener('storage', (e) => {
      if(e.key === 'rf_cross_tab_sync' && e.newValue){
        try {
          const parsed = JSON.parse(e.newValue);
          if(parsed && parsed.event && parsed.payload){
            applySyncEvent(parsed.event, parsed.payload);
          }
        } catch(err){}
      }
    });
  } catch(e){ console.warn('Realtime subscription warning:', e); }
}

/* Динамический финансовый расчёт (10% сервисный сбор, 5% залог Escrow, лизинг 15% годовых + 10% выкуп) */
function rentCalc(p, days){
  const d = Math.max(1, Number(days)||1);
  const discounted = d >= 3 && p.price3 && p.price3 < p.price;
  const unitPrice = discounted ? p.price3 : p.price;
  const rent = unitPrice * d;
  const fee = Math.round(rent * SERVICE_FEE_RATE);
  const itemVal = Number(p.value || p.price * 15);
  const deposit = Math.round(itemVal * DEPOSIT_RATE);
  const lateRatePerDay = Math.round(unitPrice * LATE_PENALTY_MULT);
  return {unitPrice, discounted, rent, fee, deposit, total: rent + fee + deposit, lateRatePerDay, itemVal};
}

function leaseCalc(p, months){
  const m = Math.max(1, Number(months)||12);
  const itemVal = Number(p.value || p.price * 20);
  const annualMultiplier = 1 + LEASE_ANNUAL_RATE * (m / 12);
  const financedPool = Math.round(itemVal * annualMultiplier);
  const monthly = Math.round(financedPool / m);
  const buyout = Math.round(itemVal * LEASE_BUYOUT_RATE);
  const deposit = Math.round(itemVal * DEPOSIT_RATE);
  const fee = Math.round(monthly * SERVICE_FEE_RATE);
  const total = monthly * m + buyout;
  const overpay = Math.max(0, total - itemVal);
  return {monthly, buyout, deposit, fee, total, overpay, itemVal};
}

/* Проверка Anti-Fraud карантина для техники > 1 000 000 ₸ */
function getCompletedCleanRentalsCount(userName){
  if(!userName) return 0;
  return state.bookings.filter(b => b.renter === userName && b.stage === 'completed' && b.depositStatus === 'returned').length;
}
function isQuarantinedForProduct(p){
  const val = Number(p.value || 0);
  if(val <= ANTI_FRAUD_LIMIT) return false;
  if(!state.user || state.user.role !== 'renter') return false;
  return getCompletedCleanRentalsCount(state.user.name) < 2;
}

function renderLifecycleStepper(b){
  const curStage = b.stage || (b.status==='completed' ? (b.depositStatus==='disputed'?'disputed':'completed') : 'signed');

    ['created', t('status_created')],
    ['signed', t('status_signed')],

    ['waiting_return', t('status_waiting_return')],
    [curStage==='disputed'?'disputed':'completed', curStage==='disputed'?t('status_disputed'):t('status_completed')]
  ];
  const idxMap = {created:0, signed:1, active:2, waiting_return:3, completed:4, disputed:4};
  const curIdx = idxMap[curStage] ?? 1;
  return `<div class="stepper">${steps.map(([key, label], idx) => {
    let cls = '';
    if(idx < curIdx) cls = 'done';

  }).join('')}</div>`;
}

  const band = PRICE_BANDS.find(([k])=>k===state.price)[1];
  const sorters = { best:(a,b)=>ownerAvg(b.seller)-ownerAvg(a.seller), worst:(a,b)=>ownerAvg(a.seller)-ownerAvg(b.seller), newest:(a,b)=>a.added<b.added?1:-1, oldest:(a,b)=>a.added>b.added?1:-1 };
  const list = P.filter(p=>p.status==='approved' && (state.cat==='all'||p.cat===state.cat) && band(p) && (state.district==='all'||p.district===state.district) && (!state.leaseOnly||p.lease) && (!q||p.name.toLowerCase().includes(q))).sort(sorters[state.sort]);
  const countEl = $('#count'), gridEl = $('#grid');
  if(!countEl || !gridEl) return;
  countEl.textContent = `${t('results')}: ${list.length}`;
  gridEl.innerHTML = list.length ? list.map(card).join('') : `<div class="empty" style="grid-column:1/-1">${t('empty_results')}</div>`;
}

function card(p){

  return `<article class="card" data-act="open" data-id="${p.id}">
    <div class="thumb" style="background:${p.grad}">
      ${cover(p)}
      <span class="badge ${free?'ok':'busy'}">${free?t('available'):t('rented')}</span>
      ${p.lease?`<span class="badge lease">${t('lease_badge')}</span>`:''}
      <button type="button" class="thumb-zoom-btn" data-act="openFullscreenMedia" data-url="${esc(mediaUrl)}" data-type="${isVid?'video':'image'}" data-title="${esc(p.name)}">${uiIcon('expand',12)} ${t('fullscreen_btn')}</button>
    </div>
    <div class="card-body">
      <h3>${esc(p.name)}</h3>
      <div class="meta">${esc(p.seller)}${vBadge()} · ${s.avg!==null?`★ ${s.avg.toFixed(1)}`:t('no_reviews')}</div>
      <div class="meta small">${t('d_'+p.district)} · ${t('value')}: ${fmt(p.value||p.price*10)} ₸</div>
      <div class="price"><b>${fmt(p.price)} ₸</b> <span>${t('per_day')}</span></div>
      ${p.price3 ? `<div class="discount-tag">${uiIcon('tag',13)} ${t('from_3_days')} ${fmt(p.price3)} ₸ ${t('per_day')}</div>` : ''}

function reviewsHTML(list){
  if(!list.length) return `<p class="muted">${t('no_reviews')}</p>`;
  return list.slice().sort((a,b)=>a.date<b.date?1:-1).map(r=>`
    <div class="review">
      <div class="rhead"><b>${esc(r.authorName)}${vBadge()}</b><span class="stars">${starText(r.stars)}</span><span class="meta">${fmtDate(r.date)}</span></div>
      <p>${esc(r.text)}</p>
    </div>`).join('');
}

function rentPanel(p){
  const m = new Date(TODAY.getFullYear(), TODAY.getMonth()+state.calOffset, 1);
  const endD = state.selEnd || state.selStart;
  const dateInfo = state.selStart ? `
    <div style="background:var(--surface2);padding:10px 12px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px">
      <span style="display:inline-flex;align-items:center;gap:6px">${uiIcon('calendar',15)} <b>${fmtDate(state.selStart)}${endD && endD!==state.selStart ? ' — '+fmtDate(endD) : ''}</b> (${dayCount()} ${t('days_short')})</span>
      <button class="link small" data-act="clearDates" style="margin:0">${t('btn_clear')}</button>
    </div>` : '';
  return `<div class="cal-head">
      <button data-act="calPrev" ${state.calOffset===0?'disabled':''}>‹</button>
      <span>${t('months')[m.getMonth()]} ${m.getFullYear()}</span>
      <button data-act="calNext">›</button>
    </div>
    <div class="cal-grid">${t('weekdays').map(w=>`<div class="wd">${w}</div>`).join('')}${calCells(p)}</div>
    ${dateInfo}
    <div class="legend">
      <span><i class="dot" style="background:var(--surface2);border:1px solid var(--border)"></i>${t('legend_free')}</span>
      <span><i class="dot" style="background:var(--busy)"></i>${t('legend_busy')}</span>
      <span><i class="dot" style="background:var(--primary)"></i>${t('legend_sel')}</span>
    </div>`;
}

function calCells(p){
  const base = new Date(TODAY.getFullYear(), TODAY.getMonth()+state.calOffset, 1);
  const first = (base.getDay()+6)%7; const days = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  const endD = state.selEnd || state.selStart; let html = '';
  for(let i=0;i<first;i++) html += '<span></span>';
  for(let d=1; d<=days; d++){
    const dt = new Date(base.getFullYear(), base.getMonth(), d), s = iso(dt);
    const past = dt < TODAY, busy = isBusy(p,s);
    const inRange = state.selStart && endD && s>=state.selStart && s<=endD;
    const edge = s===state.selStart || s===endD;
    html += `<button type="button" class="day ${past?'past':''} ${busy?'busy':''} ${inRange?'sel':''} ${edge?'edge':''}" ${past||busy?'disabled':''} data-act="day" data-val="${s}">${d}</button>`;
  } return html;
}

function leasePanel(p){
  if(!p.lease) return `<p class="muted">${t('no_lease')}</p>`;
  const c = leaseCalc(p, state.months); const saved = Math.max(0, c.itemVal - c.monthly);
  return `<label>${t('term')}
    <select data-change="months">${[6,12,24,36].map(m=>`<option value="${m}" ${m===state.months?'selected':''}>${m} ${t('months_short')}</option>`).join('')}</select></label>
    <div class="lease-compare">
      <div class="capex"><span><i class="dot" style="background:var(--busy)"></i>${t('capex_label')}</span><b>${fmt(c.itemVal)} ₸</b></div>
      <div class="opex"><span><i class="dot" style="background:var(--ok)"></i>${t('opex_label')}</span><b>${fmt(c.monthly)} ₸/${t('months_short')}</b></div>
      <div class="saved">${uiIcon('check',15)} <span>${t('saved_label')} <b>${fmt(saved)} ₸</b> ${t('saved_suffix')}</span></div>
    </div>`;
}

function summary(p){
  if(state.mode==='rent'){
    const days = state.selStart ? dayCount() : 1;
    const c = rentCalc(p, days);
    return (!state.selStart ? `<p class="muted small" style="margin-top:0">${t('pick_dates')}</p>` : '')
         + (c.discounted ? `<div class="discount-tag" style="margin-bottom:6px">${uiIcon('tag',13)} ${t('discount_3days')} ${fmt(c.unitPrice)} ₸</div>` : '')
         + row(`${days} ${t('days_short')} × ${fmt(c.unitPrice)} ₸`, fmt(c.rent)+' ₸')
         + row(t('service_fee'), fmt(c.fee)+' ₸')
         + row(t('deposit'), fmt(c.deposit)+' ₸')
         + row(t('late_penalty_label'), fmt(c.lateRatePerDay)+' ₸')
         + row(t('total'), fmt(c.total)+' ₸', 'total');
  }
  if(!p.lease) return '';
  const c = leaseCalc(p,state.months);
  return row(t('monthly'), fmt(c.monthly)+' ₸')
       + row(`× ${state.months} ${t('months_short')}`, fmt(c.monthly*state.months)+' ₸')
       + row(t('buyout'), fmt(c.buyout)+' ₸')
       + row(t('overpay'), fmt(c.overpay)+' ₸')
       + row(t('service_fee'), fmt(c.fee)+' ₸')
       + row(t('deposit'), fmt(c.deposit)+' ₸')
       + row(t('lease_total'), fmt(c.total)+' ₸', 'total');
}

function viewDashboard(){
  if(role()!=='owner'){ state.view='catalog'; return render(); }
  const me = state.user.name; 
  const mine = P.filter(p => p.seller === me || p.sellerEmail === state.user.email); 
  
  // Надежная фильтрация с проверкой продавца товара и владельца брони
  const incoming = state.bookings.filter(b => {
    const p = P.find(x => Number(x.id) === Number(b.pid));
    return (p && (p.seller === me || p.sellerEmail === state.user.email)) || b.ownerName === me;
  });

  const earned = incoming.reduce((s,b)=>s+(Number(b.total)||0),0);
  const held = incoming.filter(b=>b.depositStatus==='held'||b.depositStatus==='disputed').reduce((s,b)=>s+(Number(b.deposit)||0),0);
  const tabs = [['incoming','tab_incoming'],['mylistings','tab_mylistings'],['earnings','tab_earnings']];
  let body = '';
  if(state.dashTab==='incoming') body = incoming.length ? incoming.map(bookingForOwner).join('') : `<div class="card-box empty">${t('no_incoming')}</div>`;
  else if(state.dashTab==='mylistings') body = mine.length ? mine.map(listingItem).join('') : `<div class="card-box empty">${t('no_my_listings')}<br><br><button class="btn" data-act="nav" data-val="publish">${t('nav_publish')}</button></div>`;
  else body = `<div class="card-box">${row(t('earned'), fmt(earned)+' ₸')}${row(t('deposits_held'), fmt(held)+' ₸')}${row(t('listings_count'), mine.length)}</div>`;
  
  $('#app').innerHTML = `<div class="container">
    <h1 class="page-title">${t('dash_title')}</h1>
    <div class="seg-tabs" style="max-width:600px">${tabs.map(([k,l])=>`<button class="${state.dashTab===k?'on':''}" data-act="dashTab" data-val="${k}">${t(l)}</button>`).join('')}</div>
    ${body}
  </div>`;
}

function bookingForOwner(b){
  const p = productOf(b);
  const stage = b.stage || (b.status==='completed' ? (b.depositStatus==='disputed'?'disputed':'completed') : 'signed');
  let action = '';
  if(stage === 'signed'){
    action = `<button class="btn sm" data-act="openCondVideo" data-id="${b.id}">${uiIcon('video',14)} ${t('activate_handover_btn')}</button>`;
  } else if(stage === 'active'){
    action = `<button class="btn ghost sm" data-act="openCondVideo" data-id="${b.id}">${uiIcon('video',14)} ${t('cond_recorded')}</button>
              <button class="btn warn sm" data-act="markWaitingReturn" data-id="${b.id}">${t('send_to_return_btn')}</button>`;
  } else if(stage === 'waiting_return'){
    action = `<button class="btn sm" data-act="openComplete" data-id="${b.id}">${t('accept_return')}</button>`;
  } else if(stage === 'disputed' || b.depositStatus === 'disputed' || b.depositStatus === 'resolved'){
    action = `<button class="btn ghost sm" data-act="openDisputeHub" data-id="${b.id}">${uiIcon('video',14)} ${t('resolve_deposit')}</button>`;
  }
  return `<div class="item">
    <span class="ico" data-act="open" data-id="${p.id}" style="background:${p.grad}">${glyph(p,'glyph-sm')}</span>
    <div class="info">
      <b style="cursor:pointer" data-act="open" data-id="${p.id}">${esc(p.name)} · Сделка #${b.id}</b>
      <div class="meta">${esc(b.renter)}${vBadge()} · ${fmtDate(b.from)} — ${fmtDate(b.to)} · Итого: <b>${fmt(b.total)} ₸</b></div>
      <div class="meta">${t('deposit')}: <b>${fmt(b.deposit)} ₸</b> ${b.latePenalty ? `· <span style="color:var(--busy)">Штраф 1.5x: +${fmt(b.latePenalty)} ₸</span>` : ''} ${b.signStamp ? `· <span class="ok-text">${uiIcon('key',12)} ${esc(b.signStamp)}</span>` : ''}</div>
      ${renderLifecycleStepper(b)}

    ${b.depositStatus ? `<span class="pill ${DEP_CLASS[b.depositStatus]}">${t(DEP_LABEL[b.depositStatus])}${b.depositStatus==='resolved'?' ('+fmt(b.withheld)+' ₸)':''}</span>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${action}</div>
  </div>`;
}

function listingItem(p){

function bubble(m){
  const txt = typeof m.text==='object' ? (m.text[state.lang] || m.text.ru || '') : String(m.text||'');
  let mediaHTML = '';
  if(m.mediaUrl){
    const isVid = m.mediaType==='video' || isVideoUrl(m.mediaUrl);
    mediaHTML = `<div class="bubble-media" data-act="openFullscreenMedia" data-url="${esc(m.mediaUrl)}" data-type="${isVid?'video':'image'}" data-title="${esc(m.sender_name || t('fullscreen_title'))}">
      ${isVid ? `<video src="${m.mediaUrl}" muted playsinline></video>` : `<img src="${m.mediaUrl}" alt="Media">`}</div>`;
  }
  const senderPrefix = m.sender_name ? `<div style="font-size:11px;font-weight:700;opacity:0.8;margin-bottom:3px">${esc(m.sender_name)}</div>` : '';
  const auditHTML = m.mediaUrl ? `<div class="audit-tag">${uiIcon('shield',12)} ${t('audit_trail')} · ${m.time || '14:20'}</div>` : '';
  
  // Четкая проверка: свое сообщение или чужое
  const currentUserName = (state.user && state.user.name) ? state.user.name.trim().toLowerCase() : '';
  const senderName = (m.sender_name) ? m.sender_name.trim().toLowerCase() : '';
  const isMe = Boolean(currentUserName && senderName && currentUserName === senderName) || m.from==='me';

  return `<div class="bubble ${isMe?'me':'them'}">${senderPrefix}${mediaHTML}<div>${esc(txt)}</div>${auditHTML}</div>`;
}

const scrollMsgs = () => { const m = $('#msgs'); if(m) m.scrollTop = m.scrollHeight; };

async function sendChat(){
  if(!state.user){ toast(t('pub_need_login')); return openModal('auth'); }
  const inp = $('#chatInput'), text = inp.value.trim(); if(!text) return;
  const pid = state.chatId; if(!state.chats[pid]) state.chats[pid] = [];
  const nowTime = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  
  const msgObj = {
    id: Date.now(), 
    product_id: Number(pid), 
    from: 'me', 
    sender_name: state.user.name, 
    text: text, 
    time: nowTime
  };

  state.chats[pid].push(msgObj);
  inp.value = ''; state.showAttachMenu = false;
  
  const msgEl = $('#msgs');
  if(msgEl) {
    msgEl.insertAdjacentHTML('beforeend', bubble(msgObj)); 
    scrollMsgs();
  }

  // 1. Сохраняем в Supabase в таблицу messages
  await dbInsertMessage(msgObj);

  // 2. Отправляем уведомление владельцу товара (без дублирования)
  const prod = P.find(x => Number(x.id) === Number(pid));
  if(prod && prod.sellerEmail && prod.sellerEmail.toLowerCase() !== state.user.email.toLowerCase()){
    await addNotification({
      user_email: prod.sellerEmail,
      user_name: prod.seller,
      target_role: 'owner',
      type: 'chat_message',
      text: `Новое сообщение по товару «${prod.name}» от ${state.user.name}: «${text.slice(0, 30)}...»`
    });
  }
}

function bookingForRenter(b){
  const p = productOf(b);
  const stage = b.stage || (b.status==='completed' ? (b.depositStatus==='disputed'?'disputed':'completed') : 'signed');
  let action = '';
  if(stage === 'signed'){
    action = `<button class="btn sm" data-act="openCondVideo" data-id="${b.id}">${uiIcon('video',14)} ${t('activate_handover_btn')}</button>`;
  } else if(stage === 'active'){
    action = `<button class="btn ghost sm" data-act="openCondVideo" data-id="${b.id}">${uiIcon('video',14)} ${t('cond_recorded')}</button>
              <button class="btn warn sm" data-act="markWaitingReturn" data-id="${b.id}">${t('send_to_return_btn')}</button>`;
  } else if(stage === 'waiting_return'){
    action = `<span class="pill warn">${t('waiting_return')}</span>`;
  } else if(stage === 'completed' || stage === 'disputed'){
    const rv = REVIEWS.find(r=>r.bookingId===b.id);
    const dispBtn = (b.depositStatus==='disputed' || b.depositStatus==='resolved' || stage==='disputed') ? `<button class="btn ghost sm" data-act="openDisputeHub" data-id="${b.id}">${uiIcon('video',14)} ${t('tab_disputes')}</button>` : '';
    action = dispBtn + (rv ? `<span class="meta">${starText(rv.stars)} · ${t('review_done')}</span>` : `<button class="btn ghost sm" data-act="review" data-id="${b.id}">${t('leave_review')}</button>`);
  }
  return `<div class="item">
    <span class="ico" data-act="open" data-id="${p.id}" style="background:${p.grad}">${glyph(p,'glyph-sm')}</span>
    <div class="info">
      <b style="cursor:pointer" data-act="open" data-id="${p.id}">${esc(p.name)} · Сделка #${b.id}</b>
      <div class="meta">${t(b.type==='rent'?'type_rent':'type_lease')} · ${fmtDate(b.from)} — ${fmtDate(b.to)} · Итого: <b>${fmt(b.total)} ₸</b></div>
      <div class="meta">${t('deposit')}: <b>${fmt(b.deposit)} ₸</b> · <span class="pill ${DEP_CLASS[b.depositStatus]}">${t(DEP_LABEL[b.depositStatus])}${b.depositStatus==='resolved'?' ('+fmt(b.withheld)+' ₸)':''}</span> ${b.signStamp ? `· <span class="ok-text">${uiIcon('key',12)} ${esc(b.signStamp)}</span>`:''}</div>
      ${renderLifecycleStepper(b)}

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${action}</div>
  </div>`;
}

/* Проверка валидности формы регистрации для блокировки кнопки отправки */
function syncRegStateFromDOM(){
  const form = document.getElementById('authForm');
  if(!form || state.authTab !== 'register') return state.regFormState;
  const rf = state.regFormState;
  const getVal = n => {
    const el = form.elements.namedItem(n);
    if(!el) return '';
    return el.type === 'checkbox' ? el.checked : el.value;
  };
  if(form.elements.namedItem('name')) rf.name = getVal('name').trim();
  if(form.elements.namedItem('email')) rf.email = getVal('email').trim();
  if(form.elements.namedItem('password')) rf.password = getVal('password');
  if(form.elements.namedItem('role')) rf.role = getVal('role');
  if(form.elements.namedItem('consent')) rf.consent = !!getVal('consent');
  if(form.elements.namedItem('emergencyContact')) rf.emergencyContact = getVal('emergencyContact').trim();
  if(state.regKind === 'person'){
    if(form.elements.namedItem('iin')) rf.iin = getVal('iin').replace(/\D/g, '').slice(0, 12);
    if(form.elements.namedItem('docType')) rf.docType = getVal('docType');
    if(form.elements.namedItem('docNumber')) rf.docNumber = getVal('docNumber').trim();
  } else {
    if(form.elements.namedItem('bin')) rf.bin = getVal('bin').replace(/\D/g, '').slice(0, 12);
    if(form.elements.namedItem('companyName')) rf.companyName = getVal('companyName').trim();
  }
  return rf;
}

function getRegistrationValidationStatus(){
  const rf = syncRegStateFromDOM();
  if(!rf.name) return { ok: false, msg: 'Укажите ваше имя и фамилию' };
  if(!rf.email || rf.email.length < 3) return { ok: false, msg: 'Укажите корректный email или имя аккаунта' };
  if(!rf.password || rf.password.length < 4) return { ok: false, msg: 'Пароль должен содержать минимум 4 символа' };
  if(state.regKind === 'person'){
    if(!/^\d{12}$/.test(rf.iin)) return { ok: false, msg: 'ИИН должен состоять ровно из 12 цифр' };
    if(!rf.docNumber) return { ok: false, msg: 'Заполните номер документа (например, 045891234)' };
    if(!rf.kycDocName) return { ok: false, msg: 'Обязательно прикрепите скан или фото документа (кнопка Выбор файла)' };
  } else {
    if(!rf.companyName) return { ok: false, msg: 'Укажите наименование юридического лица' };
    if(!/^\d{12}$/.test(rf.bin)) return { ok: false, msg: 'БИН организации должен состоять ровно из 12 цифр' };
    if(!rf.kycDocName) return { ok: false, msg: 'Обязательно прикрепите скан справки о гос. регистрации' };
  }
  if(!rf.consent) return { ok: false, msg: 'Необходимо подтвердить согласие на обработку персональных данных' };
  return { ok: true, msg: '' };
}

function isRegisterFormValid(){
  return getRegistrationValidationStatus().ok;
}

function updateRegisterButtonState(){
  const btn = document.getElementById('authSubmitBtn');
  if(!btn || state.authTab !== 'register') return;
  const status = getRegistrationValidationStatus();
  const hintEl = document.getElementById('regFormHint');
  if(status.ok){
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
    btn.title = 'Все поля заполнены, нажмите для регистрации';
    if(hintEl){ hintEl.textContent = '✓ Все обязательные поля заполнены, можно регистрироваться'; hintEl.className = 'small ok-text'; }
  } else {
    btn.disabled = false; // Разрешаем клик, чтобы показать понятную ошибку
    btn.style.opacity = '0.9';
    btn.title = status.msg;
    if(hintEl){ hintEl.textContent = 'Подсказка: ' + status.msg; hintEl.className = 'small muted'; }
  }
}

async function doAuth(f){
  if(state.authTab === 'register'){
    return registerUser();
  }
  const loginInput = f.elements.namedItem('email').value.trim(), pass = f.elements.namedItem('password').value;
  if(!loginInput || pass.length<4) return setErr('mErr', t('auth_err'));
  await syncFromSupabase();
  const query = loginInput.toLowerCase();
  const u = USERS.find(x => x.email.toLowerCase() === query || x.name.toLowerCase() === query);
  if(u){
    if(u.blocked) return setErr('mErr', t('blocked_err'));
    return signIn(u);
  }
  return setErr('mErr', t('user_not_found'));
}

async function registerUser(){
  syncRegStateFromDOM();
  const rf = state.regFormState;
  const isComp = state.regKind === 'company';
  const iinBin = isComp ? rf.bin.trim() : rf.iin.trim();
  const valStatus = getRegistrationValidationStatus();
  if(!valStatus.ok){
    setErr('mErr', valStatus.msg);
    toast(valStatus.msg);
    return;
  }

  const email = rf.email.includes('@') ? rf.email.trim().toLowerCase() : `${rf.email.trim().toLowerCase().replace(/\s+/g,'_')}@rentflow.kz`;
  const prof = defaultProfile();
  prof.emergencyContact = rf.emergencyContact.trim();
  prof.kycIdFile = rf.kycDocName || 'kyc_doc.jpg';
  prof.kycScanUrl = rf.kycDocDataUrl || SAMPLE_KYC_SCAN;
  
  const u = { 
    id:'u_' + Date.now(),
    name: rf.name.trim(),
    email,
    role: rf.role,
    blocked: false,
    profile: prof,
    kind: state.regKind, 
    verification: 'pending', 
    identity: { iin: iinBin, docType: isComp ? 'company' : rf.docType, docNumber: isComp ? ('BIN-' + iinBin) : rf.docNumber.trim(), emergencyContact: rf.emergencyContact.trim() }, 
    company: isComp ? { name: rf.companyName.trim() } : null 
  };
  
  const exIdx = USERS.findIndex(x => x.email.toLowerCase() === u.email.toLowerCase());
  if(exIdx >= 0) USERS[exIdx] = Object.assign({}, USERS[exIdx], u);
  else USERS.push(u);

  // 1. Мгновенная трансляция на все устройства (Админ, Владелец, Арендатор)
  broadcastSync('user_registered', u);

  // 2. Отправка в базу Supabase
  await dbUpsertProfile(u);

/* Создание и подписание сделки: Создана -> Подписана (OTP/EDS) */
async function confirmBookingSubmit(f){
  const agree = f.elements.namedItem('offerAgree').checked, otpInp = document.getElementById('otpInput');
  if(state.signMethod === 'otp' && otpInp && otpInp.value.trim() === '1234') state.otpVerified = true;
  if(!agree || !state.otpVerified) return setErr('mErr', t('offer_err'));
  const p = P.find(x=>Number(x.id)===Number(state.productId)); if(!p) return;
  if(isQuarantinedForProduct(p)) return setErr('mErr', t('quarantine_alert'));
  const signStamp = state.signMethod === 'eds' ? 'ЭЦП НУЦ РК (RSA256)' : 'SMS-OTP #1234';

  let newBooking = null;
  if(state.mode==='rent'){
    const endDate = state.selEnd || state.selStart;
    if(rangeHasBusy(p, state.selStart, endDate)) return toast(t('range_busy'));
    const days = dayCount(), c = rentCalc(p, days);
    for(let d=parse(state.selStart); iso(d)<=endDate; d=addDays(d,1)) p.busy.push(iso(d));
    await dbUpdateProduct(p);
    const initialMedia = (p.photos && p.photos.length) ? p.photos[0] : SAMPLE_CONDITION_IMG;
    newBooking = {
      id: Date.now(), pid: p.id, renter: state.user.name, renterEmail: state.user.email, ownerName: p.seller,
      type: 'rent', from: state.selStart, to: endDate,
      rentAmount: c.rent, serviceFee: c.fee, deposit: c.deposit, total: c.total,
      stage: 'signed', status: 'upcoming', depositStatus: 'held', withheld: 0, lateDays: 0, latePenalty: 0,
      offerAccepted: true, signStamp,
      condVideo: initialMedia, condVideoName: (p.photos && p.photos.length) ? 'catalog_evidence.jpg' : 'handover_pending.mp4',
      history: ['Создана', `Подписана (${signStamp})`]
    };
    state.selStart = state.selEnd = null;
    toast(t('booked_ok'));
  } else {
    const c = leaseCalc(p, state.months), end = new Date(TODAY.getFullYear(), TODAY.getMonth()+state.months, TODAY.getDate());
    const initialMedia = (p.photos && p.photos.length) ? p.photos[0] : SAMPLE_CONDITION_IMG;
    newBooking = {
      id: Date.now(), pid: p.id, renter: state.user.name, renterEmail: state.user.email, ownerName: p.seller,
      type: 'lease', from: todayISO, to: iso(end),
      rentAmount: c.monthly * state.months, buyoutAmount: c.buyout, serviceFee: c.fee, deposit: c.deposit, total: c.total,
      stage: 'signed', status: 'upcoming', depositStatus: 'held', withheld: 0, lateDays: 0, latePenalty: 0,
      offerAccepted: true, signStamp,
      condVideo: initialMedia, condVideoName: (p.photos && p.photos.length) ? 'catalog_evidence.jpg' : 'lease_handover.mp4',
      history: ['Создана', `Подписана (${signStamp})`]
    };
    toast(t('lease_ok'));
  }
  state.bookings.unshift(newBooking);
  await dbInsertBooking(newBooking);
  await addNotification({ user_email: p.sellerEmail || 'owner@demo', user_name: p.seller, text: `Новая подписанная сделка #${newBooking.id} на «${p.name}» от ${state.user.name} (${fmt(newBooking.total)} ₸).` });
  closeModal();
  state.view='profile'; window.scrollTo(0,0); render();
}

async function markWaitingReturn(bookingId){

  if(b.stage !== 'active') return;
  b.stage = 'waiting_return';

  render();
}

/* Приёмка возврата владельцем: Ожидает возврата -> Принята (ОК) ИЛИ Открыт спор (Disputed) с фиксацией ущерба и автоштрафа 1.5x */
async function saveComplete(f){
  const b = state.bookings.find(x=>Number(x.id)===Number(state.completeBookingId)); if(!b) return;
  const p = productOf(b);
  const cond = f.elements.namedItem('cond').value;
  const lateDays = Math.max(0, Number(f.elements.namedItem('lateDays').value || 0));
  const latePenalty = lateDays > 0 ? Math.round(p.price * LATE_PENALTY_MULT * lateDays) : 0;
  b.lateDays = lateDays;
  b.latePenalty = latePenalty;
  b.total = (Number(b.total) || 0) + latePenalty;
  if(!Array.isArray(b.history)) b.history = [];

  if(cond==='ok'){
    b.stage = 'completed';
    b.status = 'completed';
    b.depositStatus = 'returned';
    b.history.push('Принята (ОК)');
    await dbUpdateBooking(b);
    await addNotification({ user_email: b.renterEmail || 'renter@demo', user_name: b.renter, text: `Сделка #${b.id} завершена без замечаний. Залог ${fmt(b.deposit)} ₸ разблокирован.` });
    closeModal(); toast(t('toast_returned')); return render();
  }

  const amount = +f.elements.namedItem('amount').value;
  const damageNote = f.elements.namedItem('damageNote') ? f.elements.namedItem('damageNote').value.trim() : '';
  if(!amount || amount<1 || amount>b.deposit || !damageNote) return setErr('mErr', t('damage_err'));
  b.withheld = amount;
  b.damageNote = damageNote + (latePenalty ? ` (плюс просрочка ${lateDays} сут. = ${fmt(latePenalty)} ₸)` : '');
  b.returnVideo = state.retUploadedUrl || SAMPLE_DAMAGE_IMG;
  b.returnVideoName = state.retUploadedName || 'return_damage_evidence.mp4';
  b.stage = 'disputed';
  b.status = 'completed';
  b.depositStatus = 'disputed';
  b.history.push('Открыт спор (Disputed)');
  state.retUploadedUrl = ''; state.retUploadedName = '';
  await dbUpdateBooking(b);
  await addNotification({ target_role: 'support', user_email: 'support@demo', text: `Открыт спор #${b.id} по «${p.name}». Заявленный ущерб: ${fmt(amount)} ₸.` });
  closeModal(); toast(t('toast_disputed')); render();
}

document.addEventListener('change', async e => {
  const key = e.target.dataset.change; if(key && C[key]) C[key](e.target);
  if(e.target.dataset.reg){
    const rk = e.target.dataset.reg;
    state.regFormState[rk] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    const btn = document.getElementById('authSubmitBtn');
    if(btn && state.authTab === 'register') btn.disabled = !isRegisterFormValid();
  }
  if(e.target.id==='kycDocInput' || e.target.id==='kycDocCapture'){
    const f = e.target.files && e.target.files[0];
    if(f){
      state.regFormState.kycDocName = f.name;
      state.regFormState.kycDocDataUrl = await fileToDataUrl(f);
      const hint = document.getElementById('kycFileHint');
      if(hint) hint.style.display = 'none';
      const wrap = document.getElementById('kycDocPreviewWrap');
      const thumb = document.getElementById('kycDocThumb');
      const nameLbl = document.getElementById('kycDocNameLabel');
      if(wrap) wrap.style.display = 'flex';
      if(thumb){
        thumb.src = state.regFormState.kycDocDataUrl;
        thumb.dataset.url = state.regFormState.kycDocDataUrl;
      }
      if(nameLbl) nameLbl.textContent = f.name;
    }
    syncRegStateFromDOM();
    updateRegisterButtonState();
  }
  if(e.target.id==='pPhotos' || e.target.id==='pPhotosCapture') handlePhotos(e.target);
  if(e.target.id==='chatMediaInput' || e.target.id==='chatCaptureInput') handleChatMedia(e.target);
  if(e.target.id==='condCaptureInput' || e.target.id==='condDeviceInput'){
    const f = e.target.files && e.target.files[0], lbl = document.getElementById('condChosenName');
    if(f){
      state.condUploadedName = f.name;
      state.condUploadedUrl = await fileToDataUrl(f);
      if(lbl){
        lbl.innerHTML = `${t('file_selected')} <b>${esc(f.name)}</b> <button type="button" class="link small" style="margin:0 0 0 8px" data-act="openFullscreenMedia" data-url="${esc(state.condUploadedUrl)}" data-type="${f.type.startsWith('video/')?'video':'image'}" data-title="Выдача: ${esc(f.name)}">[🔍 Открыть]</button>`;
      }
    }
  }
  if(e.target.id==='retCaptureInput' || e.target.id==='retDeviceInput'){
    const f = e.target.files && e.target.files[0], lbl = document.getElementById('retChosenName');
    if(f){
      state.retUploadedName = f.name;
      state.retUploadedUrl = await fileToDataUrl(f);
      if(lbl){
        lbl.innerHTML = `${t('file_defect_attached')} <b>${esc(f.name)}</b> <button type="button" class="link small" style="margin:0 0 0 8px" data-act="openFullscreenMedia" data-url="${esc(state.retUploadedUrl)}" data-type="${f.type.startsWith('video/')?'video':'image'}" data-title="Дефект: ${esc(f.name)}">[🔍 Открыть]</button>`;
      }
    }
  }
});

document.addEventListener('input', e => {
  if(e.target.dataset.input==='search'){ state.search = e.target.value; renderGrid(); }
  if(e.target.id==='otpInput'){
    state.otpVerified = (e.target.value.trim()==='1234');
    renderModal();
  }
  if(e.target.dataset.reg){
    const rk = e.target.dataset.reg;
    if(rk === 'iin' || rk === 'bin'){
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 12);
    }
    state.regFormState[rk] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if(rk === 'iin'){
      const h = document.getElementById('iinHint'), ok = /^\d{12}$/.test(state.regFormState.iin);
      if(h){ h.textContent = `${state.regFormState.iin.length}/12 цифр ${ok?'✓ Корректно':''}`; h.className = `small ${ok?'ok-text':'muted'}`; }
    }
    if(rk === 'bin'){
      const h = document.getElementById('binHint'), ok = /^\d{12}$/.test(state.regFormState.bin);
      if(h){ h.textContent = `${state.regFormState.bin.length}/12 цифр ${ok?'✓ Корректно':''}`; h.className = `small ${ok?'ok-text':'muted'}`; }
    }
    syncRegStateFromDOM();
    updateRegisterButtonState();
  }
});

document.addEventListener('submit', e => {
  e.preventDefault(); const id = e.target.id;
  if(id==='composer') sendChat(); else if(id==='pubForm') publish(e.target); else if(id==='authForm') doAuth(e.target); else if(id==='profileForm') saveProfile(e.target); else if(id==='reviewForm') saveReview(e.target); else if(id==='completeForm') saveComplete(e.target); else if(id==='bookConfirmForm') confirmBookingSubmit(e.target); else if(id==='condVideoForm') saveCondVideo(e.target);
});

seedInitialBookings();

// Восстановление активного аккаунта на текущем физическом устройстве (сессия вкладки)
(function restoreDeviceSession(){
  try {
    const saved = sessionStorage.getItem('rf_active_user_v3');
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed && parsed.email){
        state.user = parsed;
        state.view = parsed.role==='admin' ? 'admin' : parsed.role==='support' ? 'support' : parsed.role==='owner' ? 'dashboard' : 'catalog';
      }
    }
  } catch(e){}
})();

render();
syncFromSupabase();
setupRealtimeSubscription();
</script>
</body>
</html>
